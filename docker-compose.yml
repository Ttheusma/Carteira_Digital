version: '3.8'

networks: 
  frontend_net:
    driver: bridge
    internal: false
  backend_net:
    driver: bridge
    internal: true
  
volumes:
  postgres_data: 

services:
  frontend:
    build: 
      context: ./frontend
    container_name: carteira_frontend
    ports:
      - "${FRONTEND_PUBLISH_PORT}:8080"
    networks:
      - frontend_net
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: 
      context: ./backend
    container_name: carteira_backend
    ports:                  
      - "8080:8080"         
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_APP_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_APP_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod
      - APP_TAXA_SAQUE=${TAXA_SAQUE_PERCENTUAL}
      - APP_TAXA_CONVERSAO=${TAXA_CONVERSAO_PERCENTUAL}
      - APP_TAXA_TRANSFERENCIA=${TAXA_TRANSFERENCIA_PERCENTUAL}
      - APP_PRIVATE_KEY_SIZE=${PRIVATE_KEY_SIZE}
      - APP_PUBLIC_KEY_SIZE=${PUBLIC_KEY_SIZE}
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m

  database: 
    image: postgres:15-alpine
    container_name: carteira_database
    environment: 
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_ROOT_USER}
      - POSTGRES_PASSWORD=${DB_ROOT_PASSWORD} 
      - DB_APP_USER=${DB_APP_USER}
      - DB_APP_PASSWORD=${DB_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01-tabelas.sql:/docker-entrypoint-initdb.d/01-tabelas.sql:ro
      - ./database/02-setup-secops.sh:/docker-entrypoint-initdb.d/02-setup-secops.sh:ro
    networks:
      - backend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_ROOT_USER}", "-d", "${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER         
      - DAC_OVERRIDE