version: '3.8'

networks:
  frontend_net:
    driver: bridge
    internal: false
  backend_net:
    driver: bridge
    internal: true
  db_admin_net:
    driver: bridge
    internal: false

volumes:
  postgres_data:

services:
  frontend:
    image: theusmanun/carteira-frontend:latest
    container_name: carteira_frontend
    ports:
      - "${FRONTEND_PUBLISH_PORT}:8080"
    networks:
      - frontend_net
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: theusmanun/carteira-backend:latest
    container_name: carteira_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_APP_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_APP_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod
      - TAXA_SAQUE_PERCENTUAL=${TAXA_SAQUE_PERCENTUAL}
      - TAXA_CONVERSAO_PERCENTUAL=${TAXA_CONVERSAO_PERCENTUAL}
      - TAXA_TRANSFERENCIA_PERCENTUAL=${TAXA_TRANSFERENCIA_PERCENTUAL}
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m

  database:
    image: theusmanun/carteira-database:latest
    container_name: carteira_database
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_ROOT_USER}
      - POSTGRES_PASSWORD=${DB_ROOT_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=md5
      - DB_APP_USER=${DB_APP_USER}
      - DB_APP_PASSWORD=${DB_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
      - db_admin_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_ROOT_USER}", "-d", "${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE