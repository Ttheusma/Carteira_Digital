version: '3.8'

networks:
  frontend_net:
    driver: bridge
    internal: false
  backend_net:
    driver: bridge
    internal: true
  db_admin_net:
    driver: bridge
    internal: false

volumes:
  postgres_data:

services:
  frontend:
    image: theusmanun/carteira-frontend:latest
    container_name: carteira_frontend
    ports:
      - "80:8080"
    networks:
      - frontend_net
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: theusmanun/carteira-backend:latest
    container_name: carteira_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/wallet_homolog
      - SPRING_DATASOURCE_USERNAME=wallet_api_homolog
      - SPRING_DATASOURCE_PASSWORD=api123
      - SPRING_PROFILES_ACTIVE=prod
      - DB_NAME=wallet_homolog
      - DB_APP_USER=wallet_api_homolog
      - DB_APP_PASSWORD=api123
      - TAXA_SAQUE_PERCENTUAL=0.01
      - TAXA_CONVERSAO_PERCENTUAL=0.02
      - TAXA_TRANSFERENCIA_PERCENTUAL=0.01
      - PRIVATE_KEY_SIZE=32
      - PUBLIC_KEY_SIZE=16
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m

  database:
    image: theusmanun/carteira-database:latest
    container_name: carteira_database
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=wallet_homolog
      - POSTGRES_USER=db_admin_root
      - POSTGRES_PASSWORD=SuperSecureRootPassword2026!
      - POSTGRES_HOST_AUTH_METHOD=md5
      - DB_APP_USER=wallet_api_homolog
      - DB_APP_PASSWORD=api123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
      - db_admin_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "db_admin_root", "-d", "wallet_homolog"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE